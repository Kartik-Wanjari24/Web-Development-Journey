<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>complex form</h1>
    <fieldset>
        <legend>Personal Information</legend>
        <label for="name">Name</label>
        <input type="text" id="name">
        <label for="email">Email</label>
        <input type="email" id="email">
        <label for="Phone">Phone</label>
        <input type="tel" id="Phone">
        <label for="birth">Date of birth</label>
        <input type="date" name="birth" id="birth">
        <label for="gender">Gender</label>
        <label for="male">male</label>
        <input type="radio" name="x" id="male">
        <label for="female">female</label>
        <input type="radio" name="x" id="female">
        <label for="country"></label>
        <select name="country" id="country">
            <option value="ind">India</option>
            <option value="ama">America</option>
            <option value="eng">England</option>

        </select>

    </fieldset>
    <br>
    <fieldset>
        <label for="street">Address Street</label>
        <input type="text">
        <label for="city">City</label>
        <input type="text">
        <label for="zip">Zip Code</label>
        <input type="text" name="" id="zip">

    </fieldset>
    <fieldset>
        <legend>Other Information </legend>
        <label for="comments">Comments</label>
        <textarea name="" id="comments"></textarea>
        <br>
        <label for="concent">I Aggree to the terms of Service</label>
        <input type="checkbox">

    </fieldset>
    <br>
    <button>Submit</button>
</body>

</html>
